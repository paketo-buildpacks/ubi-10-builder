description = 'UBI 10 Buildpackless Builder with no buildpacks included. To use, specify buildpacks at build time.'

[lifecycle]
version = '0.21.28'

[build]
image = 'docker.io/paketobuildpacks/ubi-10-build-base:0.0.108'

[run]
[[run.images]]
image = 'docker.io/paketobuildpacks/ubi-10-run-base:latest'

[[targets]]
os = 'linux'
arch = 'amd64'

[[targets]]
os = 'linux'
arch = 'arm64'

[[targets]]
os = 'linux'
arch = 'ppc64le'

[[targets]]
os = 'linux'
arch = 'ppc64le'

[[targets]]
os = 'linux'
arch = 's390x'
