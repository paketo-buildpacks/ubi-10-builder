description = 'Ubi 10 builder with buildpacks for Node.js and Procfile'

[[buildpacks]]
uri = 'docker://docker.io/paketobuildpacks/nodejs:10.16.0'
version = '10.16.0'

[[buildpacks]]
uri = 'docker://docker.io/paketobuildpacks/procfile:5.15.8'
version = '5.15.8'

[lifecycle]
version = '0.21.29'

[[order]]
[[order.group]]
id = 'paketo-buildpacks/nodejs'
version = '10.16.0'

[[order]]
[[order.group]]
id = 'paketo-buildpacks/procfile'
version = '5.15.8'

[[extensions]]
id = 'paketo-buildpacks/ubi-nodejs-extension'
uri = 'docker://docker.io/paketobuildpacks/ubi-nodejs-extension:1.6.48'
version = '1.6.48'

[[order-extensions]]
[[order-extensions.group]]
id = 'paketo-buildpacks/ubi-nodejs-extension'
version = '1.6.48'

[build]
image = 'docker.io/paketobuildpacks/ubi-10-build-base:0.0.110'

[run]
[[run.images]]
image = 'docker.io/paketobuildpacks/ubi-10-run-base:latest'

[[targets]]
os = 'linux'
arch = 'amd64'

[[targets]]
os = 'linux'
arch = 'arm64'
