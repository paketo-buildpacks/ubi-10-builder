description = "Ubi 10 builder with buildpacks for Node.js and Procfile"

[build]
  image = "docker.io/paketobuildpacks/ubi-10-build-base:0.0.107"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/nodejs:10.14.2"
  version = "10.14.2"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.15.7"
  version = "5.15.7"

[[extensions]]
  id = "paketo-buildpacks/ubi-nodejs-extension"
  uri = "docker://docker.io/paketobuildpacks/ubi-nodejs-extension:1.6.47"
  version = "1.6.47"

[lifecycle]
  version = "0.21.27"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/nodejs"
    version = "10.14.2"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.15.7"

[[order-extensions]]

  [[order-extensions.group]]
    id = "paketo-buildpacks/ubi-nodejs-extension"
    version = "1.6.47"

[run]

  [[run.images]]
    image = "docker.io/paketobuildpacks/ubi-10-run-base:latest"

[[targets]]
  arch = "amd64"
  os = "linux"

[[targets]]
  arch = "arm64"
  os = "linux"
