description = "Ubi 10 builder with buildpacks for Node.js and Procfile"

[build]
  image = "docker.io/paketobuildpacks/ubi-10-build-base:0.0.65"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/nodejs:10.6.0"
  version = "10.6.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.13.4"
  version = "5.13.4"

[[extensions]]
  id = "paketo-buildpacks/ubi-nodejs-extension"
  uri = "docker://docker.io/paketobuildpacks/ubi-nodejs-extension:1.6.31"
  version = "1.6.31"

[lifecycle]
  version = "0.21.14"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/nodejs"
    version = "10.6.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.13.4"

[[order-extensions]]

  [[order-extensions.group]]
    id = "paketo-buildpacks/ubi-nodejs-extension"
    version = "1.6.31"

[run]

  [[run.images]]
    image = "docker.io/paketobuildpacks/ubi-10-run-base:latest"

[[targets]]
  arch = "amd64"
  os = "linux"

[[targets]]
  arch = "arm64"
  os = "linux"
